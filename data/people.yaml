      For Karsten to edit

      Karsten is a physical oceanographer and software engineer who has been at the
      forefront of open-source ocean modelling for over two decades. He is the lead
      developer of the General Ocean Turbulence Model (GOTM) and a core contributor
      to the GETM coastal ocean model.
