# Past and present projects, shown on /projects/ (newest first; "current" while end is this year or later).
# To add one, copy an entry. Fields:
#   name     short name or acronym (shown in bold, links to url)
#   title    full title
#   start    first year
#   end      last year (leave empty for open-ended work)
#   funding  programme or client, short
#   url      project page; for ended EU projects CORDIS keeps working when the project site is gone
