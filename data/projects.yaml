projects:
  - title: "NECCTON"
    description: >
      New Copernicus Capability for Trophic Ocean Networks. Developing next-generation
      marine ecosystem models to be integrated into the Copernicus Marine Service,
      with a focus on food web dynamics and ecosystem services.
    period:
      start: "2023"
      end: "2026"
    status: "active"
    funding_short: "EU Horizon Europe / UKRI"
    funding: >
      This project has received funding from Horizon Europe RIA under Grant Number 101081273 and the UK Research and Innovation
    responsible: "Jorn Bruggeman"
    official_website: "https://neccton.eu"
    our_website: ""
    partners:
      - "PML (UK)"
      - "NIOZ (NL)"
      - "CMCC (IT)"
      - "MIO (FR)"
      - "+ some more to be added"

  - title: "OceanICU"
    description: >
      New Copernicus Capability for Trophic Ocean Networks. Developing next-generation
      marine ecosystem models to be integrated into the Copernicus Marine Service,
      with a focus on food web dynamics and ecosystem services.
    period:
      start: "2023"
      end: "2026"
    status: "active"
    funding_short: "EU Horizon Europe / UKRI"
