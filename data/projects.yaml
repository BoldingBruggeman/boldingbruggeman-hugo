  - title: "MEWS"
    description: >
      When considering hydroclimatic extreme events MEWS considers the effects of present and future extreme hydrologic inputs on water supply drinking water quality,  and also the effects of the transport and processing of the input nutrients and organic carbon as it moves from input to water supply withdrawal.
    period:
      start: "2024"
      end: "2027"
    status: "active"
    funding_short: "Water4All and the Eupean Union"
    funding: >
      The Water4All Partnership have received funding from the European Union’s Horizon 2020 programme for research and innovation under Grant Agreement N°101060874. We wish to acknowledge the contribution from the Water4All RDI Funded
    responsible: "Karsten Bolding"
    official_website: "https://mews-water.com"
    our_website: ""
    partners:
      - "Uppsala University (SE)"
      - "The Kinneret Limnological Institute (IL)"
      - "Bolding & Bruggeman (DK)"
      - "get the real name (DE)"
