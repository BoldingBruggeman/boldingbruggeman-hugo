<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Bolding Bruggeman swirl logo recreation -->
  <!-- Four overlapping crescent/circle shapes in the brand palette -->
  
  <!-- Dark navy circle (top-left, partially behind) -->
  <circle cx="52" cy="44" r="28" fill="#1a2a3a" opacity="0.92"/>
  
  <!-- White/light crescent (top-left) -->
  <clipPath id="c1">
    <circle cx="52" cy="44" r="28"/>
  </clipPath>
  <circle cx="38" cy="38" r="24" fill="white" clip-path="url(#c1)"/>
  
  <!-- Mid-dark navy (right side of top cluster) -->
  <circle cx="66" cy="50" r="26" fill="#2b3f52" opacity="0.88"/>
  
  <!-- Bright teal/blue bottom-left -->
  <circle cx="42" cy="72" r="28" fill="#2b9ecf" opacity="0.85"/>
  
  <!-- Medium blue bottom -->
  <circle cx="62" cy="78" r="26" fill="#4ab8d8" opacity="0.80"/>
  
  <!-- Lightest blue right -->
  <circle cx="76" cy="66" r="24" fill="#8dd4e8" opacity="0.70"/>
</svg>
