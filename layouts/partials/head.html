<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<title>{{ if not .IsHome }}{{ .Title }} – {{ end }}{{ site.Title }}</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1d2a33; --soft: #6b7780; --sea: #006a74; --line: #e3e7ea; --bg: #ffffff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 300 1.35rem/1.6 'Outfit', system-ui, sans-serif;
         display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 2rem 1rem 9rem; text-align: center; gap: 2.5rem; }
  main img { width: min(320px, 70vw); height: auto; margin-bottom: 1.2rem; }
  p { max-width: 38rem; }
  .tip { position: relative; display: inline-block; color: var(--sea); cursor: default;
         border-bottom: 1px dotted var(--sea); outline: none; }
  .pop { position: absolute; left: 50%; bottom: calc(100% + 0.6rem); transform: translate(-50%, 0.3rem);
         background: var(--ink); color: #fff; font-size: 1rem; line-height: 1.5; font-weight: 400;
         padding: 0.5rem 0.9rem; border-radius: 6px; white-space: nowrap; text-align: left;
         opacity: 0; visibility: hidden; transition: opacity .18s, transform .18s, visibility .18s; z-index: 1; }
  .pop::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px;
                border: 6px solid transparent; border-top-color: var(--ink); }
  /* invisible bridge so the pointer can move from the word into the popup */
  .pop::before { content: ""; position: absolute; top: 100%; left: 0; right: 0; height: 0.8rem; }
  .tip:hover .pop, .tip:focus-within .pop, .tip.open .pop { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  .pop a { color: #9fdde4; text-decoration: none; }
  .pop a:hover { text-decoration: underline; }
  .cycle .pop { min-width: 6rem; text-align: center; font-weight: 500; letter-spacing: .02em; }
  .cycle .pop a { display: block; }
  footer { border-top: 1px solid var(--line); color: var(--soft); font-size: 0.8rem; text-align: center;
           padding: 1.2rem 1rem; }
  footer span + span::before { content: "·"; margin: 0 0.6em; }
  footer .tip { color: inherit; border-bottom-color: var(--soft); }
  footer .pop { text-align: center; font-weight: 300; }
  html { scroll-behavior: smooth; }
  p.more { color: var(--soft); font-size: 1rem; }
  p.more a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  p.more a:hover { color: var(--sea); border-bottom-color: var(--sea); }
  main.list p.more { align-self: center; margin: -1.5rem 0 0.5rem; }
  main.list h2 { scroll-margin-top: 1rem; }
  /* projects page */
  main.list { justify-content: flex-start; align-items: stretch; text-align: left; gap: 0; padding: 2.5rem 1rem 4rem;
              width: 100%; max-width: 46rem; margin: 0 auto; font-size: 1.05rem; }
  main.list .home { align-self: center; margin-bottom: 2.5rem; }
  main.list .home img { width: 160px; margin: 0; }
  main.list h2 { font-size: 0.8rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
                 color: var(--soft); margin: 2rem 0 0.6rem; }
  main.list ul { list-style: none; padding: 0; }
  main.list li { padding: 0.7rem 0; border-top: 1px solid var(--line); display: grid;
                 grid-template-columns: 1fr auto; column-gap: 1rem; }
  main.list .name { font-weight: 500; color: var(--sea); text-decoration: none; }
  main.list a.name:hover { text-decoration: underline; }
  main.list .client { font-weight: 400; color: var(--ink); }
  main.list .years { color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  main.list .title { grid-column: 1 / -1; line-height: 1.45; }
  main.list .funding { grid-column: 1 / -1; color: var(--soft); font-size: 0.9rem; }
  @media (max-width: 600px) {
    body { font-size: 1.15rem; }
    /* the contact popup is wider than a phone allows around the words: centre it on the paragraph */
    main p { position: relative; }
    #contact { position: static; }
    #contact .pop { bottom: calc(100% + 0.4rem); font-size: 0.95rem; }
    #contact .pop::after { display: none; }
    footer span { display: block; }
    footer span + span::before { content: none; }
  }
</style>
