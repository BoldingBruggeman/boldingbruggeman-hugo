<footer>
  <span class="tip" id="about" tabindex="0">Bolding &amp; Bruggeman ApS<span class="pop" role="tooltip">Founded in 1999 as Bolding &amp; Burchard ApS,<br>Bolding &amp; Bruggeman ApS since 2014.</span></span>
  <span>{{ .Site.Params.address }}</span>
  <span>{{ .Site.Params.cvr }}</span>
  <button class="theme" type="button" aria-label="Switch between light and dark">
    <svg class="to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    <svg class="to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</footer>
<script>
  // the light/dark switch: picks the opposite of what is shown now and keeps it in this browser
  document.querySelector(".theme").addEventListener("click", function () {
    var dark = getComputedStyle(document.documentElement).colorScheme === "dark";
    var t = dark ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (e) {}
  });
  // touch screens have no hover: a tap opens or closes a popup
  document.querySelectorAll(".tip").forEach(function (t) {
    t.addEventListener("click", function (e) {
      if (e.target.tagName === "A") return;
      var open = t.classList.toggle("open");
      if (t.classList.contains("cycle")) t.dispatchEvent(new Event(open ? "mouseenter" : "mouseleave"));
    });
  });
</script>
