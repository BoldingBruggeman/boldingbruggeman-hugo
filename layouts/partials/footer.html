<footer>
  <span class="tip" id="about" tabindex="0">Bolding &amp; Bruggeman ApS<span class="pop" role="tooltip">Founded in 2002 as Bolding &amp; Burchard ApS,<br>Bolding &amp; Bruggeman ApS since 2014.</span></span>
  <span>{{ .Site.Params.address }}</span>
  <span>{{ .Site.Params.cvr }}</span>
</footer>
<script>
  // touch screens have no hover: a tap opens or closes a popup
  document.querySelectorAll(".tip").forEach(function (t) {
    t.addEventListener("click", function (e) {
      if (e.target.tagName === "A") return;
      var open = t.classList.toggle("open");
      if (t.classList.contains("cycle")) t.dispatchEvent(new Event(open ? "mouseenter" : "mouseleave"));
    });
  });
</script>
